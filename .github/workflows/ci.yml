name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Every action is pinned to a full commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache-dependency-path: go.mod
      - run: make ci
      - name: Known-vulnerability audit
        run: make audit
      - name: Lock demo (in-process store)
        run: |
          set -o pipefail
          if go run ./cmd/distributed-lock-service demo | tee demo.log; then
            echo "::notice title=lock demo::$(grep '^verify:' demo.log)"
          else
            echo "::error title=lock demo::$(grep -E '^(verify|error):' demo.log | tr '\n' ' ')"
            exit 1
          fi

  etcd:
    # Real etcd: a three-member cluster on localhost, started from the official release binaries.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ETCD_VERSION: v3.6.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.11"
          cache-dependency-path: go.mod
      - name: Download etcd and check its SHA256 against the release's SHA256SUMS
        run: |
          set -euo pipefail
          base="https://github.com/etcd-io/etcd/releases/download/${ETCD_VERSION}"
          file="etcd-${ETCD_VERSION}-linux-amd64.tar.gz"
          curl -fsSL --max-time 120 --retry 3 -o "$file" "$base/$file"
          curl -fsSL --max-time 60 --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
          grep " ${file}\$" SHA256SUMS | sha256sum -c -
          mkdir -p etcd-bin && tar -xzf "$file" -C etcd-bin --strip-components=1
      - name: Start three etcd members
        run: |
          set -euo pipefail
          cluster="m1=http://127.0.0.1:2380,m2=http://127.0.0.1:22380,m3=http://127.0.0.1:32380"
          for m in "m1 2379 2380" "m2 22379 22380" "m3 32379 32380"; do
            set -- $m
            ./etcd-bin/etcd --name "$1" --data-dir "$RUNNER_TEMP/$1" \
              --listen-client-urls "http://127.0.0.1:$2" --advertise-client-urls "http://127.0.0.1:$2" \
              --listen-peer-urls "http://127.0.0.1:$3" --initial-advertise-peer-urls "http://127.0.0.1:$3" \
              --initial-cluster "$cluster" --initial-cluster-state new > "$RUNNER_TEMP/$1.log" 2>&1 &
          done
          for i in $(seq 1 30); do
            ./etcd-bin/etcdctl --endpoints=127.0.0.1:2379,127.0.0.1:22379,127.0.0.1:32379 endpoint health && exit 0
            sleep 1
          done
          tail -20 "$RUNNER_TEMP"/m*.log; exit 1
      - name: Integration tests against the cluster
        env:
          DLS_ETCD_ENDPOINTS: http://127.0.0.1:2379,http://127.0.0.1:22379,http://127.0.0.1:32379
        run: |
          set -o pipefail
          if make test-etcd | tee etcd.log; then
            echo "::notice title=etcd integration::$(grep -E 'etcd: ' etcd.log | sed 's/^ *//' | tr '\n' ' ')"
          else
            echo "::error title=etcd integration::$(grep -E -- '--- FAIL|etcd_integration_test' etcd.log | head -5 | tr '\n' ' ')"
            exit 1
          fi
